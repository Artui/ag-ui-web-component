name: release

# Main-triggered: every merge to `main` runs `release-publish-prepare`, which
# short-circuits to a no-op unless the version in src/version.ts has been
# bumped past the most recent `vX.Y.Z` tag.
on:
  push:
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@artooi/ag-ui-web-component
    permissions:
      id-token: write   # npm OIDC trusted publishing + provenance
      contents: write   # tag push + gh release create
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"
      - name: Install
        run: pnpm install --frozen-lockfile

      # `release-publish-prepare` runs the full suite as its final gate, and the
      # suite's `chromium` project needs a real browser. This mirrors the same
      # step in tests.yml deliberately: the release gate is a *second* place the
      # tests run, so it needs its own browsers. Without it the browser project
      # cannot start, coverage lands at 0%, and the release fails — which is
      # exactly what happened on the 0.15.0 attempt.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Prepare release (version check, test, build dist)
        id: prepare
        run: make release-publish-prepare

      - name: Publish to npm
        if: steps.prepare.outputs.released == 'true'
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          # Idempotent on purpose, for the reason the Python siblings pass
          # `skip-existing` to their upload. What gates a release is the git tag,
          # not the registry (see `prepare`), so re-running this job after a
          # failure in a later step arrives here having already published this
          # version. Without the guard the publish is the step that makes that
          # re-run impossible, and every recovery becomes manual: one sibling
          # release lost its tag, its GitHub Release and its docs deploy to a
          # single transient push failure, with the package already published.
          # npm never lets a version be republished, so skipping one cannot
          # overwrite what is on the registry.
          name="$(node -p "require('./package.json').name")"
          if npm view "$name@$VERSION" version >/dev/null 2>&1; then
            echo "$name@$VERSION is already on the registry, skipping publish"
          else
            pnpm publish --no-git-checks --access public
          fi

      - name: Tag + GitHub Release
        if: steps.prepare.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make release-publish-finalize
