name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to a commit SHA rather than a tag: a tag is mutable, and an
# action owner (or anyone who takes over the account) can silently repoint one at
# new code that then runs with this workflow's token. The trailing version comment
# is not decoration -- Dependabot reads it to know which release the SHA is, and
# rewrites both together when a newer one ships.
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: biome check
        run: pnpm lint
      - name: biome format check
        run: pnpm format:check
      - name: tsc --noEmit
        run: pnpm type-check

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build bundle
        run: pnpm build
      - name: Upload dist artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  test:
    name: node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      - name: Install
        run: pnpm install --frozen-lockfile
      # The sanitisation tests run in real Chromium (the `chromium` project in
      # vitest.config.ts), because DOMPurify does not sanitise under happy-dom.
      # Without this step those tests cannot start, and the suite would go green
      # having skipped exactly the assertions that matter most.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Test
        run: pnpm test
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-node${{ matrix.node-version }}
          path: coverage/
          if-no-files-found: ignore

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Scan repo + history
        run: gitleaks git --redact --no-banner .

  tests-passed:
    name: tests
    # always(), never !cancelled(): a skipped job reports a skipped check, and
    # branch protection counts a skipped required check as passing.
    if: always()
    needs: [lint, build, test]
    runs-on: ubuntu-latest
    steps:
      # Pass on an exact `success` from every job above, rather than failing on
      # a list of bad results: such a list passes whatever it does not name, and
      # GitHub reports a result it does not document. A job no hosted runner
      # ever picks up ("The job was not acquired by Runner of type hosted even
      # after multiple attempts") shows as cancelled on its own check but
      # reaches `needs` as `abandoned`, and a gate that failed only on `failure`
      # and `cancelled` went green over exactly that while the jobs it guards
      # never ran. A matrix reaches `needs` as one result, and one cell that did
      # not succeed is enough to make it something other than `success`.
      #
      # None of the jobs above has an `if:`, so `skipped` can only mean one of
      # them never ran, and it fails like any other result. A job that gains a
      # legitimate skip gets an exception naming it, never `skipped` accepted
      # from all of them.
      #
      # The results come in through `env` rather than being spliced into the
      # script, and every one is printed, so a red gate says which job and what
      # GitHub reported for it.
      - name: Verify every required job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          not_ok="$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"] | join(" ")')"
          if [ -n "$not_ok" ]; then
            echo "::error::required jobs did not succeed: $not_ok"
            exit 1
          fi
